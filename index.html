<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Videos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .glass {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(25, 33, 53, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <!-- Top Header -->
    <header class="w-full py-6 px-4 text-center relative z-20">
        <div class="inline-block relative">
            <h1 class="text-6xl sm:text-7xl font-black uppercase tracking-widest text-transparent select-none opacity-40 absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none" style="-webkit-text-stroke: 2px #ec4899; z-index: 1;">
                XXX
            </h1>
            <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white relative" style="z-index: 10; text-shadow: 0 4px 20px rgba(236,72,153,0.5);">
                Gallery Videos <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500"></span>
            </h2>
        </div>
        <p class="text-xs sm:text-sm text-gray-400 mt-2">Pilih video favorit Anda</p>
    </header>

    <!-- Main Container with 3D Flip Card -->
    <main class="flex-grow flex items-center justify-center px-4 pb-12">
        <div id="cardContainer" class="w-full max-w-md perspective-1000 transition-transform duration-700">
            <div id="cardInner" class="relative w-full transform-style-3d duration-700 shadow-2xl rounded-3xl">

                <!-- FRONT SIDE: Dashboard Gallery -->
                <div class="backface-hidden glass rounded-3xl p-5 flex flex-col gap-4 shadow-xl">
                    
                    <!-- Search Box -->
                    <div class="relative flex items-center">
                        <input type="text" id="searchInput" placeholder="Cari video atau artis..." 
                            class="w-full bg-slate-900/80 border border-slate-700/60 rounded-2xl py-3 pl-4 pr-24 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-pink-500 transition-all">
                        <button id="searchBtn" class="absolute right-1.5 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md transition-all">
                            Cari
                        </button>
                    </div>

                    <!-- Category Pills -->
                    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="categoryContainer">
                        <button class="cat-pill active-cat px-3.5 py-1.5 rounded-xl text-xs font-medium bg-pink-600 text-white shadow-md transition-all shrink-0" data-cat="Semua">Semua</button>
                        <button class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-gray-300 transition-all shrink-0" data-cat="Viral">Viral</button>
                        <button class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-gray-300 transition-all shrink-0" data-cat="Janda">Janda</button>
                        <button class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-gray-300 transition-all shrink-0" data-cat="ABG">ABG</button>
                        <button class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-gray-300 transition-all shrink-0" data-cat="Jilbab">Jilbab</button>
                    </div>

                    <!-- Video Grid 2x3 -->
                    <div id="videoGrid" class="grid grid-cols-2 gap-3.5"></div>

                    <!-- Pagination Controls -->
                    <div id="paginationContainer" class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs"></div>
                </div>

                <!-- BACK SIDE: Video Player & Independent Ads -->
                <div class="absolute inset-0 backface-hidden rotate-y-180 glass rounded-3xl overflow-hidden flex flex-col bg-black shadow-2xl">
                    
                    <!-- Player Top Bar Controls -->
                    <div class="absolute top-4 left-4 right-4 z-30 flex items-center justify-between pointer-events-none">
                        <div class="bg-black/70 backdrop-blur-md px-3.5 py-1.5 rounded-full text-xs font-mono text-pink-400 border border-white/10 pointer-events-auto flex items-center gap-2 shadow-lg">
                            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                            <span id="playerTimer">Streaming HD</span>
                        </div>
                        <button id="backToGalleryBtn" class="pointer-events-auto bg-slate-900/80 hover:bg-black text-white px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 backdrop-blur-md shadow-lg transition-all flex items-center gap-1.5">
                            ← Galeri
                        </button>
                    </div>

                    <!-- Video / Embed Iframe Element -->
                    <div class="relative w-full h-full flex-grow bg-black flex items-center justify-center">
                        <iframe id="mainVideoPlayer" class="w-full h-full border-0" allowfullscreen></iframe>
                        
                        <!-- Video Overlay UI Design (Play indicator skin) -->
                        <div class="absolute inset-0 bg-transparent pointer-events-none flex items-center justify-center">
                            <div class="w-16 h-16 rounded-full bg-pink-600/30 backdrop-blur-sm border border-pink-500/50 flex items-center justify-center text-white opacity-60">
                                <svg class="w-8 h-8 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                        </div>
                    </div>

                    <!-- IN-PAGE PUSH NOTIFICATION AD (Dynamic popup inside player) -->
                    <div id="inPagePush" class="absolute bottom-4 left-4 right-4 z-40 hidden">
                        <div id="pushBannerBody" class="bg-slate-900/95 border border-pink-500/40 rounded-2xl p-3.5 shadow-2xl backdrop-blur-xl flex items-center gap-3 cursor-pointer hover:border-pink-500 transition-all animate-slide-up">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-600 to-purple-600 flex items-center justify-center shrink-0 shadow-md">
                                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            </div>
                            <div class="flex-grow min-w-0">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[10px] font-bold uppercase tracking-wider text-pink-400 bg-pink-500/10 px-1.5 py-0.5 rounded">Rekomendasi</span>
                                    <span class="text-[10px] text-gray-400">Baru saja</span>
                                </div>
                                <h4 id="pushTitle" class="text-xs font-bold text-white truncate mt-0.5">Tonton Video Full Durasi Tanpa Iklan</h4>
                            </div>
                            <button id="pushCloseBtn" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-gray-400 hover:text-white flex items-center justify-center text-xs shrink-0 transition-colors">
                                ✕
                            </button>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-gray-500 border-t border-slate-800/80">
        &copy; 2026 Gallery Videos XXX. All rights reserved.
    </footer>

    <script>
        const smartlinks = [
            "https://www.profitableratecpmnetwork.com/agijdjkf?key=b68403d796344c04660419b144a9cea4",
            "https://www.profitableratecpmnetwork.com/agijdjkf?key=b68403d796344c04660419b144a9cea4"
        ];
        let smartlinkIndex = 0;

        function triggerSmartlink() {
            let url = smartlinks[smartlinkIndex];
            smartlinkIndex = (smartlinkIndex + 1) % smartlinks.length;
            window.open(url, '_blank');
        }

        const videosData = [
            { id: 1, title: "Makin cantik saat mendesah", video: "https://playmogo.com/e/wfmkvayvtbzs", gambar: "https://i.ibb.co.com/Vp9hrGSS/Mau-Crooot-link-di-bio-2.jpg", durasi: "5:21", cat: "Viral" },
            { id: 2, title: "Tante sange minta dipuasin", video: "https://playmogo.com/e/yli7cnln0h3q", gambar: "https://i.ibb.co.com/KcgStFSq/Mau-Crooot-link-di-bio-3.jpg", durasi: "8:18", cat: "Janda" },
            { id: 3, title: "Janda kirim pap ke ayang", video: "https://playmogo.com/e/o2ift9w4627c", gambar: "https://i.ibb.co.com/FLYnP4SV/9c2dfae9-f119-4b87-b122-34a601f6d459.jpg", durasi: "7:58", cat: "Janda" },
            { id: 4, title: "ABG masih sempit", video: "https://playmogo.com/e/stfvp71d0q1p", gambar: "https://i.ibb.co.com/VGPqDKS/63c3914d-974e-4801-bcfc-3ef0ef60832b.jpg", durasi: "8:06", cat: "ABG" },
            { id: 5, title: "Puasin selingkuhan crot dimuka", video: "https://playmogo.com/e/nn2hborc7t1e", gambar: "https://i.ibb.co.com/q3JHw323/086ca27a-0833-41a0-aaab-b47b50df5639.jpg", durasi: "4:47", cat: "Viral" },
            { id: 6, title: "Masih dengan selingkuhan", video: "https://playmogo.com/e/q8ytr6wsx9xp", gambar: "https://i.ibb.co.com/nMyjHKGX/Video-indo-Viral-link-di-bio.jpg", durasi: "1:23", cat: "Viral" },
            { id: 7, title: "Janda muda menikmati goyangan brondong", video: "https://playmogo.com/e/u5xpre1d5se5", gambar: "https://i.ibb.co.com/4nw2FFRD/20231648-7cae-41f6-a794-0b30078df203.jpg", durasi: "3:20", cat: "Janda" },
            { id: 8, title: "Masih imut sekali", video: "https://playmogo.com/e/dfy1draelfru", gambar: "https://i.ibb.co.com/G3H7b2xZ/26bdc8ad-b367-48bf-ac7e-deeae5d49713.jpg", durasi: "2:28", cat: "ABG" },
            { id: 9, title: "Jilbab terbaik", video: "https://playmogo.com/e/t44a33scmz0q", gambar: "https://i.ibb.co.com/nqtWMT4K/eeb7b576-9bc6-4df2-bf24-ad355f6a5c6d.jpg", durasi: "5:52", cat: "Jilbab" },
            { id: 10, title: "Perawat jilbab eksib di RS", video: "https://playmogo.com/e/hokkoa9o8xiw", gambar: "https://i.ibb.co.com/84Lc6Tq8/e06b8c3e-08de-4c0d-8e11-5dd6444b6d20.jpg", durasi: "9:33", cat: "Jilbab" }
        ];

        let currentPage = 1;
        const itemsPerPage = 6;
        let currentCategory = "Semua";
        let searchQuery = "";
        let pushInterval = null;
        let pushTimeout = null;

        const videoGrid = document.getElementById('videoGrid');
        const paginationContainer = document.getElementById('paginationContainer');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const cardInner = document.getElementById('cardInner');
        const mainVideoPlayer = document.getElementById('mainVideoPlayer');
        const backToGalleryBtn = document.getElementById('backToGalleryBtn');
        const inPagePush = document.getElementById('inPagePush');
        const pushBannerBody = document.getElementById('pushBannerBody');
        const pushCloseBtn = document.getElementById('pushCloseBtn');

        function renderGallery() {
            let filtered = videosData.filter(item => {
                let matchCat = currentCategory === "Semua" || item.cat === currentCategory;
                let matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            let totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            let start = (currentPage - 1) * itemsPerPage;
            let paginatedItems = filtered.slice(start, start + itemsPerPage);

            videoGrid.innerHTML = "";
            paginatedItems.forEach(item => {
                let card = document.createElement('div');
                card.className = "group relative aspect-[3/4] rounded-2xl overflow-hidden glass-card cursor-pointer shadow-lg hover:border-pink-500/50 transition-all duration-300";
                card.innerHTML = `
                    <img src="${item.gambar}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-2.5">
                        <span class="text-[10px] font-mono text-pink-400 font-semibold mb-0.5">${item.durasi}</span>
                        <h3 class="text-xs font-bold text-white line-clamp-2 leading-snug">${item.title}</h3>
                    </div>
                `;
                card.addEventListener('click', () => {
                    triggerSmartlink();
                    openPlayer(item);
                });
                videoGrid.appendChild(card);
            });

            paginationContainer.innerHTML = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="text-gray-600 cursor-not-allowed px-2 py-1"' : 'class="text-gray-300 hover:text-white px-2 py-1 font-semibold"'}>Prev</button>
                <span class="text-gray-400 font-medium">Hal ${currentPage} dari ${totalPages}</span>
                <button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled class="text-gray-600 cursor-not-allowed px-2 py-1"' : 'class="text-gray-300 hover:text-white px-2 py-1 font-semibold"'}>Next</button>
            `;
        }

        function changePage(page) {
            let filtered = videosData.filter(item => {
                let matchCat = currentCategory === "Semua" || item.cat === currentCategory;
                let matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });
            let totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderGallery();
            }
        }

        document.querySelectorAll('.cat-pill').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-pill').forEach(b => {
                    b.classList.remove('bg-pink-600', 'text-white', 'shadow-md');
                    b.classList.add('bg-slate-800/80', 'text-gray-300');
                });
                e.target.classList.remove('bg-slate-800/80', 'text-gray-300');
                e.target.classList.add('bg-pink-600', 'text-white', 'shadow-md');
                currentCategory = e.target.getAttribute('data-cat');
                currentPage = 1;
                renderGallery();
            });
        });

        searchBtn.addEventListener('click', () => {
            searchQuery = searchInput.value.trim();
            currentPage = 1;
            renderGallery();
        });
        searchInput.addEventListener('keyup', (e) => {
            searchQuery = searchInput.value.trim();
            currentPage = 1;
            renderGallery();
        });

        function startInPagePushCycle() {
            // Clear existing timers to avoid stacking
            clearTimeout(pushTimeout);
            clearInterval(pushInterval);

            // Muncul pertama kali setelah 10 detik video berjalan
            pushTimeout = setTimeout(() => {
                showPushBanner();
                
                // Muncul berikutnya setiap 20 detik sekali
                pushInterval = setInterval(() => {
                    showPushBanner();
                }, 20000);
            }, 10000);
        }

        function showPushBanner() {
            inPagePush.classList.remove('hidden');
            // Auto hide setelah 8 detik jika tidak diklik
            setTimeout(() => {
                inPagePush.classList.add('hidden');
            }, 8000);
        }

        function stopInPagePushCycle() {
            clearTimeout(pushTimeout);
            clearInterval(pushInterval);
            inPagePush.classList.add('hidden');
        }

        function openPlayer(item) {
            cardInner.classList.add('rotate-y-180');
            mainVideoPlayer.src = item.video;
            startInPagePushCycle();
        }

        backToGalleryBtn.addEventListener('click', () => {
            cardInner.classList.remove('rotate-y-180');
            mainVideoPlayer.src = "";
            stopInPagePushCycle();
        });

        // Event listener untuk In-Page Push dan tombol close (terhubung smartlink)
        pushBannerBody.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerSmartlink();
            inPagePush.classList.add('hidden');
        });

        pushCloseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerSmartlink();
            inPagePush.classList.add('hidden');
        });

        renderGallery();
    </script>
</body>
</html>
